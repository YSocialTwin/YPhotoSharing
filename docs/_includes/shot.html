<figure class="ys-shot{% if include.wide %} wide{% endif %}"><a href="{{ site.baseurl }}/assets/images/screens/{{ include.file }}.webp" class="ys-zoom" data-full="{{ site.baseurl }}/assets/images/screens/{{ include.file }}.webp" aria-label="{{ include.caption | escape }}"><img src="{{ site.baseurl }}/assets/images/screens/{{ include.file }}-s.webp" alt="{{ include.alt | default: include.caption | escape }}" loading="lazy" width="640" height="400"></a><figcaption>{{ include.caption }}</figcaption></figure>
